<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9C7938" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072242" />
      <stop offset="100%" stop-color="#021024" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16" />
  
  <!-- Outer thin margin -->
  <rect x="36" y="36" width="440" height="440" rx="94" fill="none" stroke="#051C3A" stroke-width="4" />

  <!-- Rays of Light -->
  <g opacity="0.15">
    <polygon points="256,320 0,256 0,224" fill="url(#goldGrad)" />
    <polygon points="256,320 0,160 0,128" fill="url(#goldGrad)" />
    <polygon points="256,320 0,64 0,32" fill="url(#goldGrad)" />
    <polygon points="256,320 32,0 64,0" fill="url(#goldGrad)" />
    <polygon points="256,320 128,0 160,0" fill="url(#goldGrad)" />
    <polygon points="256,320 224,0 256,0" fill="url(#goldGrad)" />
    <polygon points="256,320 256,0 288,0" fill="url(#goldGrad)" />
    <polygon points="256,320 352,0 384,0" fill="url(#goldGrad)" />
    <polygon points="256,320 448,0 480,0" fill="url(#goldGrad)" />
    <polygon points="256,320 512,64 512,96" fill="url(#goldGrad)" />
    <polygon points="256,320 512,160 512,192" fill="url(#goldGrad)" />
    <polygon points="256,320 512,256 512,288" fill="url(#goldGrad)" />
  </g>

  <!-- Side decorative lines inside the border -->
  <g stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <line x1="56" y1="120" x2="56" y2="392" stroke-dasharray="8,12" />
    <line x1="456" y1="120" x2="456" y2="392" stroke-dasharray="8,12" />
  </g>

  <!-- Rays on left/right edges (horizontal lines) -->
  <g stroke="url(#goldGrad)" stroke-width="4" opacity="0.35">
    <line x1="45" y1="160" x2="70" y2="160" />
    <line x1="45" y1="200" x2="70" y2="200" />
    <line x1="45" y1="240" x2="70" y2="240" />
    <line x1="45" y1="280" x2="70" y2="280" />
    <line x1="45" y1="320" x2="70" y2="320" />
    <line x1="45" y1="360" x2="70" y2="360" />
    
    <line x1="442" y1="160" x2="467" y2="160" />
    <line x1="442" y1="200" x2="467" y2="200" />
    <line x1="442" y1="240" x2="467" y2="240" />
    <line x1="442" y1="280" x2="467" y2="280" />
    <line x1="442" y1="320" x2="467" y2="320" />
    <line x1="442" y1="360" x2="467" y2="360" />
  </g>

  <!-- Growth Arrows pointing upwards from center -->
  <g stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Straight Up Arrow -->
    <path d="M 256,180 L 256,105" />
    <path d="M 244,117 L 256,105 L 268,117" stroke-width="5" fill="url(#goldGrad)" />
    
    <!-- Angled Arrow 1 (Slight Right) -->
    <path d="M 270,185 L 298,125" />
    <path d="M 286,128 L 298,125 L 303,138" stroke-width="5" fill="url(#goldGrad)" />

    <!-- Angled Arrow 2 (Far Right) -->
    <path d="M 285,195 L 340,140" />
    <path d="M 326,142 L 340,140 L 338,154" stroke-width="5" fill="url(#goldGrad)" />
  </g>

  <!-- Open Book Base Layer (Golden Outer Edge / Cover) -->
  <path d="M 256,380 C 210,360 146,365 146,365 L 146,210 C 146,210 200,205 256,225 C 312,205 366,210 366,210 L 366,365 C 366,365 302,360 256,380 Z" fill="#04152B" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Book Pages Layer (Thick Inner Pages) -->
  <path d="M 256,368 C 216,348 158,352 158,352 L 158,222 C 158,222 208,218 256,238 C 304,218 354,222 354,222 L 354,352 C 354,352 296,348 256,368 Z" fill="#082245" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
        
  <!-- Center Book Divider -->
  <line x1="256" y1="238" x2="256" y2="368" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Golden Flame / Leaves in the Center -->
  <!-- Central Lobe -->
  <path d="M 256,290 C 224,275 220,220 248,155 C 254,142 258,155 260,165 C 272,215 288,255 256,290 Z" fill="url(#goldGrad)" stroke="#04152B" stroke-width="2" />
        
  <!-- Left Lobe -->
  <path d="M 240,280 C 212,260 205,215 225,185 C 228,198 238,220 240,280 Z" fill="url(#goldGrad)" stroke="#04152B" stroke-width="2" />

  <!-- Right Lobe -->
  <path d="M 272,280 C 300,260 307,215 287,185 C 284,198 274,220 272,280 Z" fill="url(#goldGrad)" stroke="#04152B" stroke-width="2" />

  <!-- Small Flame Core Accent -->
  <path d="M 256,275 C 244,265 242,240 252,210 C 254,205 256,210 257,215 C 262,235 268,255 256,275 Z" fill="#FFFFFF" opacity="0.7" />
</svg>